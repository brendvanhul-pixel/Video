<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 300">
  <!-- Drawn hook block, v2. Light from upper left, sky rim light on the left edges.
       Rope entry x=46 and x=78 at y=0. Hook saddle (sling seat) x=58, y=250. -->
  <defs>
    <linearGradient id="front" x1="0" x2="1">
      <stop offset="0" stop-color="#e2a400"/><stop offset=".22" stop-color="#ffd54a"/><stop offset=".5" stop-color="#f7c21e"/><stop offset="1" stop-color="#d79a00"/>
    </linearGradient>
    <linearGradient id="vert" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#5a3c00" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="side" x1="0" x2="1"><stop offset="0" stop-color="#b47b00"/><stop offset="1" stop-color="#7d5300"/></linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe07a"/><stop offset=".5" stop-color="#f4bd16"/><stop offset="1" stop-color="#cf9200"/></linearGradient>
    <radialGradient id="cap" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff4c4"/><stop offset=".35" stop-color="#ffcf30"/><stop offset=".8" stop-color="#c88d00"/><stop offset="1" stop-color="#8f6200"/></radialGradient>
    <linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#4b5157"/><stop offset=".3" stop-color="#dfe3e6"/><stop offset=".55" stop-color="#8d949a"/><stop offset="1" stop-color="#3c4146"/></linearGradient>
    <filter id="ao" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="2" seed="9" result="n"/>
      <feColorMatrix in="n" values="0 0 0 0 .5  0 0 0 0 .38  0 0 0 0 .1  0 0 0 .5 -.12"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="frontclip"><path id="fp" d="M16,40 Q16,36 19,33 L36,15 Q39,12 43,12 H85 Q89,12 92,15 L105,29 V152 L94,167 Q92,170 88,170 H30 Q26,170 24,167 L16,155 Z"/></clipPath>
  </defs>

  <!-- wire ropes -->
  <g stroke-linecap="butt">
    <line x1="46" y1="0" x2="46" y2="20" stroke="#262a2e" stroke-width="3.6"/><line x1="46" y1="0" x2="46" y2="20" stroke="#a4adb5" stroke-width="1.8" stroke-dasharray=".7 .8"/>
    <line x1="78" y1="0" x2="78" y2="20" stroke="#262a2e" stroke-width="3.6"/><line x1="78" y1="0" x2="78" y2="20" stroke="#a4adb5" stroke-width="1.8" stroke-dasharray=".7 .8"/>
  </g>
  <!-- side face (gives the block depth) -->
  <path d="M105,29 L116,37 V147 L105,152 Z" fill="url(#side)"/>
  <path d="M105,29 L116,37" stroke="#ffe48a" stroke-width=".8" opacity=".6"/>
  <!-- front face -->
  <use href="#fp" fill="url(#front)"/>
  <g clip-path="url(#frontclip)">
    <rect width="130" height="180" fill="url(#vert)"/>
    <!-- hazard band, painted -->
    <g transform="translate(0,86)">
      <rect width="130" height="22" fill="#f9c613"/>
      <g fill="#1a1b1d"><path d="M-8,22 L6,0 H18 L4,22Z"/><path d="M16,22 L30,0 H42 L28,22Z"/><path d="M40,22 L54,0 H66 L52,22Z"/><path d="M64,22 L78,0 H90 L76,22Z"/><path d="M88,22 L102,0 H114 L100,22Z"/></g>
      <rect width="130" height="2" fill="#000" opacity=".18"/><rect y="20" width="130" height="2" fill="#000" opacity=".12"/>
    </g>
    <rect width="130" height="180" fill="url(#vert)" opacity=".7"/>
    <!-- rim light from the sky -->
    <path d="M17,40 V154" stroke="#d8ecff" stroke-width="1.2" opacity=".35"/>
    <path d="M20,34 L37,16" stroke="#fff6cf" stroke-width="1.4" opacity=".7"/>
    <rect width="130" height="180" filter="url(#grain)" opacity=".55"/>
  </g>
  <!-- top cheek plate + sheave pin -->
  <path d="M38,24 H88 L96,34 V76 H30 V34 Z" fill="url(#plate)" stroke="#a36d00" stroke-width=".7"/>
  <path d="M38,24 H88" stroke="#fff3c2" stroke-width=".8"/>
  <circle cx="63" cy="51" r="15" fill="#000" opacity=".25" filter="url(#ao)"/>
  <circle cx="63" cy="50" r="13.5" fill="url(#cap)" stroke="#8a5c00" stroke-width=".7"/>
  <circle cx="63" cy="50" r="5.5" fill="#c58c00"/><circle cx="62" cy="49" r="5.5" fill="none" stroke="#ffe48a" stroke-width=".6" opacity=".8"/>
  <!-- lower plate + pin -->
  <rect x="36" y="116" width="54" height="42" rx="3.5" fill="url(#plate)" stroke="#a36d00" stroke-width=".7"/>
  <circle cx="63" cy="138" r="11" fill="#000" opacity=".22" filter="url(#ao)"/>
  <circle cx="63" cy="137" r="10" fill="url(#cap)" stroke="#8a5c00" stroke-width=".7"/>
  <!-- bolts -->
  <g><g fill="#7a5100"><circle cx="35" cy="40" r="2"/><circle cx="91" cy="40" r="2"/><circle cx="35" cy="70" r="2"/><circle cx="91" cy="70" r="2"/><circle cx="42" cy="122" r="1.7"/><circle cx="84" cy="122" r="1.7"/><circle cx="42" cy="152" r="1.7"/><circle cx="84" cy="152" r="1.7"/></g>
     <g fill="#ffef b0" fill-opacity=".9"><circle cx="34.4" cy="39.4" r=".8" fill="#fff0b0"/><circle cx="90.4" cy="39.4" r=".8" fill="#fff0b0"/><circle cx="34.4" cy="69.4" r=".8" fill="#fff0b0"/><circle cx="90.4" cy="69.4" r=".8" fill="#fff0b0"/></g></g>
  <!-- load plate -->
  <rect x="52" y="78.5" width="22" height="5.5" rx="1" fill="#eef0f2" stroke="#7a5100" stroke-width=".4"/>
  <path d="M55,81.2h16" stroke="#9aa1a8" stroke-width=".7" stroke-dasharray="2 1"/>
  <!-- contact shadow under block -->
  <ellipse cx="62" cy="176" rx="20" ry="4" fill="#000" opacity=".25" filter="url(#ao)"/>
  <!-- swivel nut -->
  <rect x="45" y="170" width="34" height="11" rx="2.5" fill="url(#steel)"/>
  <rect x="45" y="170" width="34" height="2" rx="1" fill="#fff" opacity=".35"/>
  <rect x="50" y="181" width="24" height="10" rx="2" fill="url(#front)"/>
  <!-- forged hook: shank on the rope axis, back bulging right, saddle under the shank, tip curling in -->
  <clipPath id="hookclip"><path id="hk" d="M53,189 H71 V209 C77,213 88,226 88,247 C88,267 75,280 58,280 C41,280 28,268 28,249 C28,233 32,219 38,206 L41,198 C42,195.5 46,195.5 46.5,198.5 L47,212 C43.5,222 44.5,235 49,243 C53,251 62,253 66.5,245 C70,237 69.5,226 66.5,219 C63,215 58,214 53,214 Z"/></clipPath>
  <use href="#hk" fill="url(#front)"/>
  <g clip-path="url(#hookclip)">
    <rect x="0" y="185" width="130" height="100" fill="url(#vert)" opacity=".8"/>
    <path d="M80,222 C84,232 84,258 70,270" fill="none" stroke="#fff1b8" stroke-width="3.2" opacity=".7" stroke-linecap="round"/>
    <path d="M66,192 V208" stroke="#fff1b8" stroke-width="2.4" opacity=".7" stroke-linecap="round"/>
    <path d="M33,249 C33,233 36,220 42,208" fill="none" stroke="#d8ecff" stroke-width="2" opacity=".45" stroke-linecap="round"/>
    <path d="M49,243 C53,251 62,253 66.5,245" fill="none" stroke="#6b4600" stroke-width="5" opacity=".45"/>
    <path d="M34,268 C44,282 72,282 84,262" fill="none" stroke="#6b4600" stroke-width="7" opacity=".32"/>
    <path d="M53,214 C58,214 63,215 66.5,219" fill="none" stroke="#6b4600" stroke-width="3" opacity=".4"/>
    <rect x="0" y="185" width="130" height="100" filter="url(#grain)" opacity=".5"/>
  </g>
  <use href="#hk" fill="none" stroke="#8a5c00" stroke-width=".8"/>
  <!-- safety latch -->
  <path d="M44,198 L54,212" stroke="#3b4045" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M43.6,197.8 L53.6,211.8" stroke="#d9dde0" stroke-width="1" stroke-linecap="round"/>
</svg>
